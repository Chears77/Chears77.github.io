<script>
(function(){
 var WRAP=document.getElementById('listWrap'),EMP=document.getElementById('emptyTip');
 var FIL=document.getElementById('filters');
 function esc(s){var d=document.createElement('div');d.appendChild(document.createTextNode(s));return d.innerHTML;}
 function fmt(ymd){return ymd.slice(0,4)+'.'+ymd.slice(4,6)+'.'+ymd.slice(6);}
 function rowsHtml(list){
  var h='';
  list.forEach(function(x){
   h+='<a class="row" href="'+x.p+'" title="'+esc(x.t)+'"><span class="dt">'+fmt(x.ymd)+'</span>'+
    '<span class="tt">'+esc(x.t)+'</span><span class="arr">&#8594;</span></a>';
  });
  return h;
 }
 function render(y){
  var list=y==='all'?__D:__D.filter(function(x){return x.y===y;});
  EMP.style.display=list.length?'none':'block';
  WRAP.innerHTML=list.length?rowsHtml(list):'';
 }
 function buildFilters(){
  var years=[],seen={};
  __D.forEach(function(x){if(!seen[x.y]){seen[x.y]=1;years.push(x.y);}});
  years.sort(function(a,b){return b.localeCompare(a);});
  var h='<button class="fbtn on" data-y="all">全部</button>';
  years.forEach(function(y){h+='<button class="fbtn" data-y="'+y+'">'+y+' 年</button>';});
  FIL.innerHTML=h;
  [].slice.call(FIL.querySelectorAll('.fbtn')).forEach(function(b){b.addEventListener('click',function(){
   [].slice.call(FIL.querySelectorAll('.fbtn')).forEach(function(x){x.classList.remove('on')});
   b.classList.add('on');render(b.getAttribute('data-y'));
  });});
 }
 function buildHead(){
  var cnt=document.getElementById('subCnt');

  var ps=document.getElementById('pageSub');

 }
 buildFilters();buildHead();render('all');
})();
