<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>荣誉墙 · Alisa</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ========== Top Bar ========== -->
<nav class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="topbar-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      返回首页
    </a>
    <span class="topbar-title">荣誉墙</span>
    <span style="width:80px"></span>
  </div>
</nav>

<!-- ========== Content ========== -->
<div class="page-content">
  <p style="text-align:center; color:var(--text-light); margin-bottom:var(--space-xl);">
    &#127942; 每一份荣誉，都是成长的闪光点
  </p>

  <!-- Year Filter -->
  <div class="year-filter" id="yearFilter">
    <button class="year-filter-btn active" data-year="all">全部</button>
  </div>

  <!-- Photo Wall -->
  <section class="honor-photo-section">
    <h2 class="section-title"><span>&#128247;</span> 荣誉照片墙 <span>&#128247;</span></h2>
    <div class="honor-photo-grid" id="honorPhotoGrid"></div>
  </section>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-close" id="lightboxClose">&times;</div>
  <div class="lightbox-nav lightbox-prev" id="lightboxPrev">&#10094;</div>
  <img class="lightbox-img" id="lightboxImg" src="" alt="">
  <div class="lightbox-nav lightbox-next" id="lightboxNext">&#10095;</div>
  <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<!-- ========== Footer ========== -->
<footer class="footer">
  <div class="footer-hearts">&#10084; &#10084; &#10084;</div>
  <p class="footer-quote">"每一份努力都值得被看见"</p>
  <p class="footer-copy">&copy; 2015 &mdash; 2026 Alisa 成长纪念册</p>
</footer>

<script src="js/main.js"></script>
<script src="js/honor-photos.js"></script>
<script>
(function build() {
  var photoContainer = document.getElementById('honorPhotoGrid');
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightboxImg');
  var lightboxCaption = document.getElementById('lightboxCaption');
  var currentPhotos = [];
  var currentIndex = 0;

  function buildPhotoMeta(item) {
    var parts = [];
    if (item.unit) parts.push(item.unit);
    if (item.detail) parts.push(item.detail);
    return parts.join(' · ');
  }

  function renderPhotos(filter) {
    photoContainer.innerHTML = '';
    currentPhotos = filter === 'all' ? honorPhotos : honorPhotos.filter(function(p) { return p.year === filter; });

    if (currentPhotos.length === 0) {
      photoContainer.innerHTML = '<p style="text-align:center;color:var(--text-light);grid-column:1/-1;padding:var(--space-xl) 0;">该年份暂无照片记录</p>';
      return;
    }

    currentPhotos.forEach(function(item, index) {
      var div = document.createElement('div');
      div.className = 'honor-photo-card fade-in';
      div.innerHTML =
        '<div class="honor-photo-frame">' +
          '<img src="' + item.src + '" alt="' + item.title + '" loading="lazy">' +
        '</div>' +
        '<div class="honor-photo-info">' +
          '<span class="honor-photo-year">' + item.year + '</span>' +
          '<h4>' + item.title + '</h4>' +
          '<div class="honor-photo-meta">' + buildPhotoMeta(item) + '</div>' +
        '</div>';
      div.addEventListener('click', function() { openLightbox(index); });
      photoContainer.appendChild(div);
    });
  }

  function renderAll(filter) {
    renderPhotos(filter);
    setTimeout(function() {
      document.querySelectorAll('.fade-in').forEach(function(el) { el.classList.add('visible'); });
    }, 50);
  }

  function openLightbox(index) {
    currentIndex = index;
    updateLightbox();
    lightbox.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function updateLightbox() {
    var item = currentPhotos[currentIndex];
    lightboxImg.src = item.src;
    lightboxCaption.innerHTML = '<strong>' + item.title + '</strong><br>' + item.year + (item.unit ? ' · ' + item.unit : '') + (item.detail ? ' · ' + item.detail : '');
  }

  function closeLightbox() {
    lightbox.classList.remove('active');
    document.body.style.overflow = '';
  }

  function nextPhoto() {
    currentIndex = (currentIndex + 1) % currentPhotos.length;
    updateLightbox();
  }

  function prevPhoto() {
    currentIndex = (currentIndex - 1 + currentPhotos.length) % currentPhotos.length;
    updateLightbox();
  }

  // Lightbox events
  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  document.getElementById('lightboxPrev').addEventListener('click', function(e) { e.stopPropagation(); prevPhoto(); });
  document.getElementById('lightboxNext').addEventListener('click', function(e) { e.stopPropagation(); nextPhoto(); });
  lightbox.addEventListener('click', function(e) { if (e.target === lightbox || e.target === lightboxImg) closeLightbox(); });
  document.addEventListener('keydown', function(e) {
    if (!lightbox.classList.contains('active')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') nextPhoto();
    if (e.key === 'ArrowLeft') prevPhoto();
  });

  // Year filter
  document.getElementById('yearFilter').addEventListener('click', function(e) {
    if (!e.target.classList.contains('year-filter-btn')) return;
    document.querySelectorAll('.year-filter-btn').forEach(function(b) { b.classList.remove('active'); });
    e.target.classList.add('active');
    renderAll(e.target.dataset.year);
  });

  // 根据照片自动生成年份筛选按钮（新增年份无需改 HTML）
  (function buildYearButtons() {
    var yf = document.getElementById('yearFilter');
    var years = [];
    honorPhotos.forEach(function(p) {
      if (years.indexOf(p.year) === -1) years.push(p.year);
    });
    years.sort(function(a, b) { return String(b).localeCompare(String(a)); });
    years.forEach(function(y) {
      var b = document.createElement('button');
      b.className = 'year-filter-btn';
      b.setAttribute('data-year', y);
      b.textContent = y;
      yf.appendChild(b);
    });
  })();

  renderAll('all');
})();
</script>
</body>
</html>
