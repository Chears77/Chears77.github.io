<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Alisa 的成长纪念</title>
<link rel="stylesheet" href="css/style.css">
<style>
/* ===== Hero (V1 style full-screen cover) ===== */
.hero {
  position:relative; min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(170deg, var(--pink-light) 0%, var(--cream) 40%, var(--yellow) 80%, var(--pink-light) 100%);
  overflow:hidden;
}
.hero-content { text-align:center; z-index:2; padding:var(--space-xl); }
.hero-avatar {
  width:150px; height:150px; margin:0 auto var(--space-xl);
  border-radius:var(--radius-full); border:4px solid var(--white);
  box-shadow:var(--shadow-lg);
  background:linear-gradient(135deg, var(--pink-light), var(--pink));
  display:flex; align-items:center; justify-content:center;
  animation:heroFadeIn 1s ease 0.1s both, heartbeat 8s ease-in-out 1.5s infinite;
}
.hero-title {
  font-size:var(--font-2xl); color:var(--pink-dark);
  margin-bottom:var(--space-md); font-weight:700; letter-spacing:1px;
  animation:heroFadeIn 1s ease 0.3s both;
}
.hero-subtitle {
  font-size:var(--font-md); color:var(--text-light);
  animation:heroFadeIn 1s ease 0.6s both;
}
.hero-scroll {
  position:absolute; bottom:var(--space-xl); left:50%; transform:translateX(-50%);
  color:var(--pink-dark); opacity:0.7;
  animation:bounceDown 2s ease-in-out infinite; cursor:pointer;
}

/* Decorative elements */
.hero-deco { position:absolute; pointer-events:none; z-index:1; }
.deco-cloud {
  position:absolute; background:rgba(255,255,255,0.5); border-radius:50%;
}
.deco-cloud-1 { width:120px; height:50px; top:15%; left:8%; animation:floatCloud 7s ease-in-out infinite; }
.deco-cloud-2 { width:90px; height:38px; top:25%; right:10%; animation:floatCloud 9s ease-in-out 2s infinite; }
.deco-cloud-3 { width:100px; height:42px; top:60%; left:12%; animation:floatCloud 8s ease-in-out 4s infinite; }
.deco-star {
  position:absolute; color:#FFD700; opacity:0.4; font-size:24px;
  animation:floatStar 5s ease-in-out infinite;
}
.deco-star-1 { top:12%; right:20%; }
.deco-star-2 { top:45%; left:8%; animation-delay:1.5s; }
.deco-star-3 { top:70%; right:15%; animation-delay:3s; font-size:18px; }
.deco-star-4 { top:30%; left:75%; animation-delay:4.5s; font-size:20px; }
.deco-flower {
  position:absolute; opacity:0.35; font-size:28px;
  animation:floatStar 6s ease-in-out infinite;
}
.deco-flower-1 { top:18%; left:25%; animation-delay:1s; }
.deco-flower-2 { top:55%; right:8%; animation-delay:3s; }
.deco-flower-3 { top:78%; left:40%; animation-delay:5s; }

/* ===== Sticky Nav ===== */
.nav {
  position:sticky; top:0; z-index:1000;
  background:rgba(255,255,255,0.88); backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:0 2px 12px rgba(0,0,0,0.05);
  height:56px;
}
.nav-inner {
  max-width:var(--max-width); margin:0 auto; height:100%;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 var(--space-lg);
}
.nav-logo {
  font-size:var(--font-md); font-weight:700; color:var(--pink-dark);
  white-space:nowrap; letter-spacing:0.5px;
}
.nav-right { display:flex; align-items:center; gap:var(--space-sm); }

/* Hamburger */
.nav-toggle {
  display:flex; flex-direction:column; gap:5px;
  background:none; border:none; padding:var(--space-sm); z-index:1001;
}
.nav-toggle span {
  display:block; width:24px; height:2.5px; background:var(--text);
  border-radius:2px; transition:all var(--trans-base); transform-origin:center;
}
.nav-toggle.active span:nth-child(1) { transform:rotate(45deg) translate(5px,5px); }
.nav-toggle.active span:nth-child(2) { opacity:0; }
.nav-toggle.active span:nth-child(3) { transform:rotate(-45deg) translate(5px,-5px); }

/* Menu (mobile dropdown) */
.nav-menu {
  position:fixed; top:56px; left:0; width:100%;
  background:rgba(255,255,255,0.97); backdrop-filter:blur(12px);
  display:flex; flex-direction:column; padding:var(--space-md);
  transform:translateY(-110%); opacity:0;
  transition:transform var(--trans-base), opacity var(--trans-base);
  pointer-events:none; box-shadow:var(--shadow-md);
  border-radius:0 0 var(--radius-lg) var(--radius-lg);
}
.nav-menu.active { transform:translateY(0); opacity:1; pointer-events:auto; }
.nav-link {
  display:block; padding:var(--space-md); color:var(--text);
  font-size:var(--font-base); border-radius:var(--radius-sm);
  transition:all var(--trans-fast);
}
.nav-link:hover, .nav-link.active { background:var(--pink-light); color:var(--pink-dark); font-weight:600; }

/* ===== Preview 2x2 Grid ===== */
.preview-grid-wrap {
  padding:var(--space-2xl) var(--space-lg);
  background:var(--cream);
}
.preview-grid-title {
  text-align:center; font-size:var(--font-xl); color:var(--pink-dark);
  font-weight:700; margin-bottom:var(--space-xl);
  display:flex; align-items:center; justify-content:center; gap:var(--space-md);
}
.preview-grid-title::before, .preview-grid-title::after {
  content:''; width:36px; height:2px; border-radius:1px;
}
.preview-grid-title::before { background:linear-gradient(90deg, var(--pink), transparent); }
.preview-grid-title::after  { background:linear-gradient(90deg, transparent, var(--pink)); }

.preview-grid {
  display:grid; grid-template-columns:1fr; gap:var(--space-md);
  max-width:var(--max-width); margin:0 auto;
}
.preview-cell {
  background:var(--white); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm); padding:var(--space-lg);
  transition:transform var(--trans-base), box-shadow var(--trans-base);
  text-align:left !important;
}
.preview-cell:hover { transform:translateY(-4px); box-shadow:var(--shadow-md); }
.preview-cell-header {
  display:block !important; text-align:left !important;
  margin-bottom:var(--space-md); font-size:0;
}
.preview-cell-icon {
  display:inline-flex !important; align-items:center; justify-content:center;
  width:48px; height:48px; border-radius:var(--radius-md);
  font-size:24px; flex-shrink:0; vertical-align:middle;
}
.preview-cell-icon.timeline { background:var(--pink-light); }
.preview-cell-icon.honors   { background:var(--yellow); }
.preview-cell-icon.gallery  { background:linear-gradient(135deg, var(--pink-light), var(--yellow)); }
.preview-cell-icon.diary    { background:var(--blue-light); }
.preview-cell-title {
  display:inline !important; vertical-align:middle;
  font-size:var(--font-md); font-weight:700; color:var(--text-dark);
  margin-left:var(--space-md);
}
.preview-cell-item { font-size:var(--font-sm); color:var(--text-dark); padding:3px 4px; display:flex; align-items:center; justify-content:flex-start; gap:var(--space-sm); text-decoration:none; border-radius:var(--radius-sm); transition:background var(--trans-fast), color var(--trans-fast); }
.preview-cell-item:hover { background:var(--pink-light); color:var(--pink-dark); }
.preview-cell-item::before { content:''; width:5px; height:5px; border-radius:50%; background:var(--pink); flex-shrink:0; }
.preview-cell-item .preview-tag { display:inline-block; padding:0 6px; border-radius:10px; font-size:10px; font-weight:600; margin-left:4px; flex-shrink:0; }
.preview-cell-more {
  display:inline-block; margin-top:var(--space-md);
  padding:var(--space-sm) var(--space-lg); border-radius:var(--radius-full);
  background:var(--pink-light); color:var(--pink-dark); font-weight:600;
  font-size:var(--font-sm); transition:all var(--trans-fast);
}
.preview-cell-more:hover { background:var(--pink); color:var(--white); }

/* Animations */
@keyframes floatCloud {
  0%,100%{transform:translateY(0) translateX(0);}
  25%{transform:translateY(-12px) translateX(8px);}
  50%{transform:translateY(-5px) translateX(16px);}
  75%{transform:translateY(-15px) translateX(6px);}
}
@keyframes floatStar {
  0%,100%{transform:translateY(0) rotate(0deg); opacity:0.3;}
  50%{transform:translateY(-18px) rotate(10deg); opacity:0.6;}
}
@keyframes bounceDown {
  0%,100%{transform:translateX(-50%) translateY(0); opacity:0.5;}
  50%{transform:translateX(-50%) translateY(12px); opacity:0.9;}
}

/* Responsive */
@media (min-width: 768px) {
  .hero-title { font-size:var(--font-3xl); }
  .hero-avatar { width:170px; height:170px; }
  .nav-toggle { display:none; }
  .nav-menu {
    position:static; flex-direction:row; transform:none; opacity:1;
    pointer-events:auto; background:transparent; box-shadow:none;
    padding:0; width:auto; gap:var(--space-xs);
  }
  .nav-link { padding:var(--space-sm) var(--space-md); }
  .preview-grid { grid-template-columns:1fr 1fr; }
}
@media (min-width: 1024px) {
  .hero-title { font-size:48px; }
  .preview-grid { gap:var(--space-lg); }
}
</style>

<script>
// Hamburger menu
(function() {
  var toggle = document.getElementById('navToggle');
  var menu   = document.getElementById('navMenu');
  toggle.addEventListener('click', function() {
    toggle.classList.toggle('active');
    menu.classList.toggle('active');
  });
  menu.querySelectorAll('.nav-link').forEach(function(link) {
    link.addEventListener('click', function() {
      toggle.classList.remove('active');
      menu.classList.remove('active');
    });
  });
})();
</script>

<!-- 首页四方格预览：动态渲染（数据来自上方四个数据文件） -->
<script>
(function() {
  // 生成一条可点击目录项：text 为主文本，href 为跳转链接，sub 为主题底纹标签（可选）
  function item(text, href, sub, subStyle) {
    var a = document.createElement('a');
    a.className = 'preview-cell-item';
    if (href) a.href = href;
    if (sub) {
      a.appendChild(document.createTextNode(text + ' '));
      var sp = document.createElement('span');
      sp.className = 'preview-tag';
      if (subStyle) sp.style.cssText = subStyle;
      sp.textContent = sub;
      a.appendChild(sp);
    } else {
      a.textContent = text;
    }
    return a;
  }
  function dateKey(name){ var m = String(name).match(/^(\d{6,8})/); return m ? parseInt(m[1],10) : 0; }

  // 1. 成长时间轴（点击进入完整时间轴）
  var tl = document.getElementById('timelinePreviewList');
  if (tl && typeof TIMELINE_SUMMARY !== 'undefined') {
    Object.keys(TIMELINE_SUMMARY).map(Number).sort(function(a,b){return b-a;}).slice(0,3).forEach(function(y){
      var summary = TIMELINE_SUMMARY[y] || '';
      if (summary.length > 16) summary = summary.substr(0,16) + '\u2026';
      tl.appendChild(item(y + ' \u00b7 ' + summary, '1timeline/timeline.html#y' + y));
    });
  }

  // 2. 荣誉墙（日期 + 名称，点击进入荣誉墙）
  var hp = document.getElementById('honorPreviewList');
  if (hp && typeof honorPhotos !== 'undefined') {
    honorPhotos.slice().sort(function(a,b){ return dateKey(b.src) - dateKey(a.src); }).slice(0,3).forEach(function(h){
      var name = (h.title || '');
      if (name.length > 14) name = name.substr(0,14) + '\u2026';
      var idx = honorPhotos.indexOf(h);
      hp.appendChild(item(String(dateKey(h.src)) + ' ' + name, '2rongyuqiang/honors.html#h' + idx));
    });
  }

  // 3. 相册画廊（日期 + 名称，点击进入相册）
  var gp = document.getElementById('galleryPreviewList');
  if (gp && typeof galleryPhotos !== 'undefined') {
    galleryPhotos.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); }).slice(0,3).forEach(function(g){
      var name = (g.caption || '');
      if (name.length > 14) name = name.substr(0,14) + '\u2026';
      var gidx = galleryPhotos.indexOf(g);
      gp.appendChild(item((g.date || '') + ' ' + name, '3gallery/gallery.html#g' + gidx));
    });
  }

  // 4. 成长日记（日期 + 名称 + 主题底纹，点击进入对应文章/图片页）
  var dp = document.getElementById('diaryPreviewList');
  if (dp && typeof DIARY_DATA !== 'undefined') {
    var catLabel = {school:'校园', essay:'作文', diary:'日记', parents:'父母期许', video:'视频', photo:'图片', other:'其他'}; // 仅兜底，主题优先取 x.theme
    // 去掉标题里已隐含的主题前缀（如“作文—”“作文：”“作文”），避免与末尾主题重复
    function stripTopic(title, topic) {
      if (!topic) return title;
      if (title.indexOf(topic) === 0) {
        var rest = title.slice(topic.length);
        if (/^[\u2014\u2013\uff1a:]/.test(rest)) rest = rest.slice(1);
        return rest;
      }
      return title;
    }
    function fmtDate(d){ if(!d||d.length<8) return d||''; return d.substr(0,4)+'.'+d.substr(4,2)+'.'+d.substr(6,2); } // 须与 diary.html 的 fmt() 保持一致
    DIARY_DATA.slice(0,3).forEach(function(x){
      var topic = x.theme || catLabel[x.cat] || x.cat || ''; // 主题以文件夹词为准，与 diary.html 列表一致
      var name = stripTopic(x.title || '', topic);
      if (name.length > 12) name = name.substr(0,12) + '\u2026';
      // 主题底纹配色（与 diary.html 列表 chip 一致）：作文=粉、日记=琥珀、校园=蓝、父母期许=紫、图片=绿、视频=深、未知=中性
      var subStyle = 'background:#EDE7F6;color:#7E6AA8';
      if (x.cat === 'essay') subStyle = 'background:var(--pink-light);color:var(--pink-dark)';
      else if (x.cat === 'diary') subStyle = 'background:linear-gradient(135deg,var(--pink-light),var(--yellow));color:var(--pink-dark)';
      else if (x.cat === 'school') subStyle = 'background:var(--blue-light);color:var(--blue-dark)';
      else if (x.cat === 'parents') subStyle = 'background:#F1E9FB;color:#9A78C8';
      else if (x.cat === 'photo') subStyle = 'background:#E8F5E9;color:#5BA16F';
      else if (x.cat === 'video') subStyle = 'background:#1a1a2e;color:#fff';
      var href = '4diaries/' + (x.folder || '') + '/index.html';
      dp.appendChild(item(fmtDate(x.date) + ' ' + name, href, topic, subStyle));
    });
  }
})();
</script>
